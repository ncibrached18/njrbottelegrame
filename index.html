<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tap Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background: #1c1c28;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 60px;
    }
    #tapBtn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      font-size: 28px;
      background: gold;
      border: none;
    }
  </style>
</head>

<body>

<h1 id="score">Points: 0</h1>
<button id="tapBtn">TAP</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  let points = 0;

  document.getElementById("tapBtn").onclick = () => {
    points++;
    document.getElementById("score").innerText = "Points: " + points;
  };

  tg.MainButton.setText("📤 إرسال النقاط");
  tg.MainButton.show();

  tg.MainButton.onClick(() => {
    tg.sendData(JSON.stringify({
      points: points
    }));
    tg.close();
  });
</script>

</body>
</html>
